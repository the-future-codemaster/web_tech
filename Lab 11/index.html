<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Student Directory Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #f4f6f9;
      color: #2c3e50;
      padding: 30px 15px;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 6px;
      color: #1a365d;
    }

    p.subtitle {
      color: #718096;
      font-size: 0.92rem;
      margin-bottom: 20px;
    }

    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #cbd5e0;
      border-radius: 5px;
      font-size: 0.95rem;
    }

    button {
      background: #2b6cb0;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
    }

    button:hover {
      background: #2c5282;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th,
    td {
      text-align: left;
      padding: 11px 12px;
      border-bottom: 1px solid #e2e8f0;
      font-size: 0.92rem;
    }

    th {
      background: #edf2f7;
      color: #4a5568;
    }

    tr:hover {
      background: #f7fafc;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 600;
      background: #e2e8f0;
      color: #4a5568;
    }

    .form-panel {
      margin-top: 30px;
      padding: 18px;
      background: #f8fafc;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
    }

    .form-panel h3 {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: #2d3748;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .form-grid input {
      padding: 8px 10px;
      border: 1px solid #cbd5e0;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .notice {
      margin-top: 12px;
      padding: 10px;
      border-radius: 4px;
      display: none;
      font-size: 0.9rem;
    }

    .notice.success {
      background: #def7ec;
      color: #03543f;
      display: block;
    }

    .notice.error {
      background: #fde8e8;
      color: #9b1c1c;
      display: block;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Student Information Portal</h1>

    <!-- Query Search -->
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search by student name or branch (e.g., AI&DS, Amrut)...">
      <button onclick="fetchStudents()">Filter</button>
      <button style="background: #718096;" onclick="resetSearch()">Reset</button>
    </div>

    <!-- Student Table -->
    <table>
      <thead>
        <tr>
          <th>Roll No</th>
          <th>Name</th>
          <th>Branch</th>
          <th>Year</th>
          <th>CGPA</th>
          <th>Email</th>
        </tr>
      </thead>
      <tbody id="studentRows">
        <tr>
          <td colspan="6" style="text-align:center; color:#888;">Loading records...</td>
        </tr>
      </tbody>
    </table>

    <!-- Add Student Form -->
    <div class="form-panel">
      <h3>Add New Student</h3>
      <form id="addForm" onsubmit="submitStudent(event)">
        <div class="form-grid">
          <input type="text" id="rollNo" placeholder="Roll No / ID" required>
          <input type="text" id="name" placeholder="Full Name" required>
          <input type="text" id="branch" placeholder="Branch (e.g. CSE)" required>
          <input type="text" id="year" placeholder="Year (e.g. 3rd)" required>
          <input type="text" id="cgpa" placeholder="CGPA" required>
          <input type="email" id="email" placeholder="Email ID" required>
        </div>
        <button type="submit">Save Student</button>
      </form>
      <div id="noticeBox" class="notice"></div>
    </div>
  </div>

  <script>
    async function fetchStudents(query = '') {
      try {
        const url = query ? `/api/students?q=${encodeURIComponent(query)}` : '/api/students';
        const res = await fetch(url);
        const data = await res.json();
        const tbody = document.getElementById('studentRows');
        tbody.innerHTML = '';

        if (!data || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:#888;">No student records found.</td></tr>';
          return;
        }

        data.forEach(s => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td><strong>${s.id}</strong></td>
            <td>${s.name}</td>
            <td><span class="badge">${s.branch}</span></td>
            <td>${s.year}</td>
            <td>${s.cgpa}</td>
            <td>${s.email}</td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        console.error('Failed to load students:', err);
      }
    }

    function resetSearch() {
      document.getElementById('searchInput').value = '';
      fetchStudents();
    }

    async function submitStudent(e) {
      e.preventDefault();
      const student = {
        id: document.getElementById('rollNo').value.trim(),
        name: document.getElementById('name').value.trim(),
        branch: document.getElementById('branch').value.trim().toUpperCase(),
        year: document.getElementById('year').value.trim(),
        cgpa: document.getElementById('cgpa').value.trim(),
        email: document.getElementById('email').value.trim()
      };

      try {
        const res = await fetch('/api/students', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(student)
        });
        const result = await res.json();
        const notice = document.getElementById('noticeBox');

        if (res.ok) {
          notice.className = 'notice success';
          notice.textContent = result.message || 'Student added successfully!';
          document.getElementById('addForm').reset();
          fetchStudents();
        } else {
          notice.className = 'notice error';
          notice.textContent = result.error || 'Failed to add student.';
        }
      } catch (err) {
        const notice = document.getElementById('noticeBox');
        notice.className = 'notice error';
        notice.textContent = 'Server connection error.';
      }
    }

    document.getElementById('searchInput').addEventListener('keyup', (e) => {
      if (e.key === 'Enter') fetchStudents(e.target.value);
    });

    // Initial fetch on load
    fetchStudents();
  </script>
</body>

</html>
